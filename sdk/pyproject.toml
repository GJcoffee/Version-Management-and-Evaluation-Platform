[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalp-sdk"
version = "0.1.0"
description = "EvalP 代码型 agent 接入辅助：几行代码接入 evalp-agent/1 协议（HTTP / 子进程），零第三方依赖"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evalp_sdk = ["py.typed"]
