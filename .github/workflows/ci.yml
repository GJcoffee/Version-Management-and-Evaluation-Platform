name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # 后端：ruff + pytest（Windows / macOS / Linux；Linux 同时覆盖 3.11 与 3.12）
  backend:
    name: backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Windows 上子进程启动慢，全量约 30 分钟
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            sdk/pyproject.toml
      - name: 安装依赖
        run: |
          # jieba 只有 sdist，构建时需要较新的 setuptools / wheel
          python -m pip install --upgrade pip "setuptools>=68" wheel
          pip install -e "backend[dev]" -e sdk
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python -m pytest -q

  # 前端：tsc / eslint / vitest / 构建（Linux）
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc
        run: npx tsc --noEmit
      - name: eslint
        run: npm run lint
      - name: vitest
        run: npx vitest run
      - name: build
        run: npm run build

  # wheel：构建（内置前端产物）、检查内容，并在干净 venv 里安装后冒烟
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 构建并检查 wheel
        run: |
          python -m pip install --upgrade pip "setuptools>=68" wheel build
          python scripts/build_wheel.py --outdir "$RUNNER_TEMP/dist"
      - name: 安装并冒烟
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$RUNNER_TEMP"/dist/evalp-*.whl
          "$RUNNER_TEMP/venv/bin/evalp" --help
          export EVALP_DATA_DIR="$RUNNER_TEMP/evalp-data"
          "$RUNNER_TEMP/venv/bin/evalp" serve --port 7899 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://127.0.0.1:7899/ && break
            sleep 1
          done
          curl -fs http://127.0.0.1:7899/ | grep -qi "<!doctype html"
