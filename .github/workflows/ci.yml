name: CI

# 本地自用项目：只在 macOS 上跑，且只手动触发（Actions 页面 → CI → Run workflow），推送时不自动跑
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            sdk/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: |
          # jieba 只有 sdist，构建时需要较新的 setuptools / wheel
          python -m pip install --upgrade pip "setuptools>=68" wheel
          pip install -e "backend[dev]" -e sdk
          npm ci --prefix frontend
      - name: 前端
        working-directory: frontend
        run: npx tsc --noEmit && npm run lint && npx vitest run && npm run build
      - name: 后端
        run: ruff check . && python -m pytest -q
